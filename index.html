:root {
  --deep:   #0d2440;
  --deeper: #081a30;
  --ink:    #0a1c30;
  --sheet:  #e9e7dd;
  --sheet-2:#d5d1c1;
  --rule:   #b0aa98;
  --hair:   #c6c1b0;
  --dim:    #665f4e;
  --on-deep:#f0eee6;
  --on-deep-dim: #9db2c9;
  --signal: #c8175a;

  --sheet-w: 1180px;
  --gut: 40px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: #2c4463 var(--deeper); }

body {
  margin: 0;
  background: var(--deep);
  color: var(--ink);
  font-family: 'Archivo', system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--ink); color: var(--sheet); }
.on-deep ::selection { background: var(--sheet); color: var(--ink); }
input { caret-color: var(--ink); }

::-webkit-scrollbar { width: 13px; height: 13px; }
::-webkit-scrollbar-track { background: var(--deeper); }
::-webkit-scrollbar-thumb { background: #2c4463; border: 3px solid var(--deeper); }
::-webkit-scrollbar-thumb:hover { background: #3d5b80; }

:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.masthead :focus-visible, footer :focus-visible { outline-color: var(--sheet); }

/* ---------- shared type atoms ---------- */
.label {
  font-size: 13px;
  font-weight: 700;
  font-stretch: 78%;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  line-height: 1.2;
}
.num { font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1; }
.unit { font-size: 0.58em; font-weight: 600; vertical-align: 0.32em; margin-right: 0.1em; color: var(--dim); }

/* ---------- masthead ---------- */
.masthead {
  background: var(--deep);
  color: var(--on-deep);
  padding: 34px var(--gut) 0;
}
.masthead-in {
  max-width: var(--sheet-w);
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
  padding-bottom: 16px;
}
.wordmark {
  margin: 0;
  font-size: clamp(46px, 6.4vw, 74px);
  font-weight: 700;
  font-stretch: 118%;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 0.92;
}
.edition { text-align: right; }
.edition .label { color: var(--on-deep-dim); margin: 0 0 5px; }
.edition .today { font-size: 19px; font-weight: 600; color: var(--on-deep); letter-spacing: 0.08em; margin: 0; }

/* double rule: almanac convention */
.masthead-rules { max-width: var(--sheet-w); margin: 0 auto; }
.masthead-rules i { display: block; }
.masthead-rules i.thick { height: 3px; background: var(--sheet); }
.masthead-rules i.thin  { height: 1px; margin-top: 3px; background: #6d86a3; }

.standing {
  max-width: var(--sheet-w);
  margin: 0 auto;
  padding: 14px 0 32px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 34px;
  color: var(--on-deep-dim);
}
.standing .stat { font-size: 15px; letter-spacing: 0.05em; }
.standing b { color: var(--on-deep); font-weight: 700; }
.standing .caution b { color: var(--signal); }

/* ---------- the sheet ---------- */
.sheet-wrap { padding: 0 var(--gut) 64px; }
.sheet {
  max-width: var(--sheet-w);
  margin: 0 auto;
  background: var(--sheet);
  /* printed stock with a real edge, not a floating card */
  box-shadow: 0 3px 0 var(--sheet-2), 0 20px 42px -22px rgba(0,0,0,0.66);
}

/* ---------- new entry form ---------- */
.newentry { padding: 28px 34px 32px; border-bottom: 3px solid var(--ink); }
.newentry > .label { color: var(--dim); margin: 0 0 20px; }
.form-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr auto;
  gap: 24px;
  align-items: end;
}
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field > .label { color: var(--dim); }
.field input {
  font: inherit;
  font-size: 19px;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--rule);
  border-radius: 0;
  padding: 7px 2px;
  width: 100%;
  min-width: 0;
}
.field input:hover { border-bottom-color: var(--dim); }
.field input:focus { outline: none; border-bottom-color: var(--ink); }
.field input:focus-visible { outline: none; box-shadow: 0 2px 0 var(--ink); }
.field input::placeholder { color: #8d8571; }
.field input[type=date] { color-scheme: light; }

.types { display: flex; border: 2px solid var(--ink); width: fit-content; margin-bottom: 26px; }
.types label {
  padding: 10px 20px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  font-stretch: 78%;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  transition: background 140ms cubic-bezier(.16,1,.3,1), color 140ms cubic-bezier(.16,1,.3,1);
}
.types label + label { border-left: 2px solid var(--ink); }
.types input { position: absolute; opacity: 0; pointer-events: none; }
.types label:has(input:checked) { background: var(--ink); color: var(--sheet); }
.types label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 3px; }

button {
  font: inherit;
  cursor: pointer;
  border-radius: 0;
  font-size: 13px;
  font-weight: 700;
  font-stretch: 78%;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border: 2px solid var(--ink);
  background: var(--ink);
  color: var(--sheet);
  padding: 12px 26px;
  transition: background 140ms cubic-bezier(.16,1,.3,1), color 140ms cubic-bezier(.16,1,.3,1);
}
button:hover { background: transparent; color: var(--ink); }

/* ---------- entries ---------- */
.entries { list-style: none; margin: 0; padding: 0; }
.entry { position: relative; padding: 32px 34px; border-bottom: 1px solid var(--hair); }
.entry:last-child { border-bottom: 0; }

/* chart convention: magenta marks a caution and nothing else on this page may use it */
.entry.caution::before {
  content: "";
  position: absolute;
  left: 0; top: 32px; bottom: 32px;
  width: 4px;
  background: var(--signal);
}

.entry-head { display: flex; align-items: baseline; gap: 24px; }
.ident { flex: 1; min-width: 0; }
.name {
  margin: 0;
  font-size: clamp(25px, 2.5vw, 33px);
  font-weight: 700;
  font-stretch: 104%;
  letter-spacing: -0.015em;
  line-height: 1.1;
  word-break: break-word;
}
.ident .label { color: var(--dim); margin: 8px 0 0; }

.arrival { text-align: right; white-space: nowrap; }
.arrival .date { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 0.06em; }
.arrival .out {
  margin: 5px 0 0; font-size: 13px; font-weight: 700; font-stretch: 78%;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);
}
.arrival .out.sig { color: var(--signal); }

.acts { display: flex; gap: 2px; }
.icon-btn {
  border: 0; background: transparent; color: var(--dim);
  padding: 8px; line-height: 0;
  transition: color 120ms cubic-bezier(.16,1,.3,1);
}
.icon-btn:hover { background: transparent; color: var(--ink); }
.icon-btn svg { display: block; width: 17px; height: 17px; }

/* figure table */
.figs {
  margin: 24px 0 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--hair);
}
.figs.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.figs > div { padding: 14px 20px 0 0; }
.figs dt {
  color: var(--dim); font-size: 13px; font-weight: 700; font-stretch: 78%;
  letter-spacing: 0.16em; text-transform: uppercase;
}
.figs dd {
  margin: 6px 0 0;
  font-size: clamp(24px, 2.3vw, 31px);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.05;
  font-variant-numeric: tabular-nums lining-nums;
}
.figs dd.sig { color: var(--signal); }
.figs dd.sig .unit { color: var(--signal); }
.figs dd small {
  display: block; margin-top: 6px;
  font-size: 13px; font-weight: 700; font-stretch: 78%;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
}
.figs dd.sig small { color: var(--signal); }

/* the surveyed scale bar */
.scale { margin-top: 30px; }
.scale-track { position: relative; height: 1px; background: var(--rule); }
.scale-run {
  position: absolute; left: 0; top: -1px; height: 3px;
  width: 100%;
  background: var(--ink);
  transform: scaleX(var(--pct));
  transform-origin: left center;
  transition: transform 620ms cubic-bezier(.16,1,.3,1);
}
.scale-tick {
  position: absolute; top: -5px; width: 1px; height: 11px;
  background: var(--rule);
  transform: translateX(-0.5px);
}
.scale-tick.end { height: 15px; top: -7px; background: var(--ink); width: 2px; }
.scale-flag {
  /* offset, not a full-width box: a 100%-wide element translated to 100%
     doubles the track and pushes the sheet into horizontal overflow */
  position: absolute; top: -12px;
  left: calc(var(--pct) * 100%);
  pointer-events: none;
  transition: left 620ms cubic-bezier(.16,1,.3,1);
}
.scale-flag b {
  position: absolute; left: -6px; top: 0;
  width: 12px; height: 11px;
  background: var(--ink);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.scale-labels {
  position: relative; height: 20px; margin-top: 11px;
  font-size: 13px; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.scale-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.scale-labels span.zero { transform: none; }
.scale-labels span.full { transform: translateX(-100%); }

/* milestone status */
.status { margin-top: 24px; border-top: 1px solid var(--hair); padding-top: 20px; }
.check {
  display: inline-flex; align-items: center; gap: 13px;
  cursor: pointer;
  font-size: 13px; font-weight: 700; font-stretch: 78%;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--dim);
}
.check input {
  appearance: none; -webkit-appearance: none;
  margin: 0; width: 27px; height: 27px;
  border: 2px solid var(--ink);
  background: transparent;
  display: grid; place-content: center;
  cursor: pointer;
}
.check input::after {
  content: "";
  width: 15px; height: 15px;
  background: var(--ink);
  clip-path: polygon(13% 46%, 0 60%, 38% 100%, 100% 22%, 86% 8%, 36% 70%);
  transform: scale(0);
  transition: transform 180ms cubic-bezier(.16,1,.3,1);
}
.check input:checked::after { transform: scale(1); }
.check input:checked ~ span { color: var(--ink); }

/* log-an-amount row */
.log { margin-top: 26px; display: flex; align-items: flex-end; gap: 16px; max-width: 430px; }
.log .field { flex: 1; }
.log button { padding: 11px 22px; }

/* ---------- recorded ---------- */
.recorded-head {
  display: flex; align-items: center; gap: 18px;
  padding: 24px 34px 0;
  border-top: 3px solid var(--ink);
}
.recorded-head .label { color: var(--dim); margin: 0; }
.recorded-head i { flex: 1; height: 1px; background: var(--hair); }
.entry.done { padding-top: 20px; padding-bottom: 20px; }
.entry.done .name {
  font-size: clamp(19px, 1.7vw, 22px);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  color: var(--dim);
}
.entry.done .filed {
  font-size: 13px; font-weight: 700; font-stretch: 78%;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);
  white-space: nowrap;
}

/* ---------- empty ---------- */
.empty { padding: 68px 34px; text-align: center; }
.empty p { margin: 0; font-size: 19px; color: var(--dim); }

/* ---------- legend / colophon ---------- */
footer { color: var(--on-deep-dim); padding: 0 var(--gut) 60px; }
.footer-in { max-width: var(--sheet-w); margin: 0 auto; }
.footer-in > i { display: block; height: 1px; background: #24405f; margin-bottom: 26px; }
.legend { display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: flex-start; }
.legend dl { margin: 0; display: flex; flex-direction: column; gap: 10px; max-width: 62ch; }
.legend dt { color: var(--on-deep); margin: 0; }
.legend dd { margin: 0; font-size: 15px; display: flex; align-items: baseline; gap: 11px; }
.legend .swatch { width: 14px; height: 14px; background: var(--signal); flex: none; transform: translateY(2px); }
.legend .rulekey { width: 32px; height: 3px; background: var(--sheet); flex: none; transform: translateY(-4px); }
.records { margin-left: auto; display: flex; gap: 12px; }
.records button { border-color: #35527a; background: transparent; color: var(--on-deep); padding: 11px 20px; }
.records button:hover { background: var(--sheet); color: var(--ink); border-color: var(--sheet); }

/* ---------- entrance: content is visible by default ---------- */
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 520ms cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
}
@media (prefers-reduced-motion: reduce) {
  .scale-run, .scale-flag, .check input::after, button, .icon-btn, .types label { transition: none; }
}

/* ---------- narrow ---------- */
@media (max-width: 900px) {
  :root { --gut: 20px; }
  .form-grid { grid-template-columns: 1fr 1fr; }
  .form-grid .wide, .form-grid .submit { grid-column: 1 / -1; }
  .form-grid .submit button { width: 100%; }
  .figs, .figs.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .figs > div { padding-bottom: 14px; }
  .entry, .newentry, .recorded-head, .empty { padding-left: 20px; padding-right: 20px; }
  .scale-labels span.mid { display: none; }
  .records { margin-left: 0; width: 100%; }
  .records button { flex: 1; }
}
@media (max-width: 620px) {
  .entry-head { flex-wrap: wrap; }
  .arrival { text-align: left; order: 3; width: 100%; }
  .acts { order: 2; }
  .log { max-width: none; }
}
</style>
</head>
<body>
<!--
  THESIS: A goal is a predicted arrival, so this is the reference volume that predicts arrivals. It
  refuses the fintech dashboard this category always ships: no rounded cards, no donut, no pill bar.
  OWN-WORLD: Admiralty chart two-ink press. Deep chart-blue ground, one continuous buff sheet ruled by
  hairlines, Archivo worked across its width axis (expanded masthead, condensed tracked labels),
  tabular figures as the content. Magenta is reserved for cautions only, as on a real chart.
  STORY: A stranger given five seconds reads where every commitment stands and which one is pressing.
  FIRST VIEWPORT: Full-bleed blue masthead, GOALS in expanded caps, standing totals under a double
  rule; then one buff sheet whose first block is the ruled new-entry form, entries below divided by
  hairlines, each with a figure table and a surveyed scale bar carrying a labelled position flag.
  FORM: The Almanac, candidate 7 of my ordered list; seed key 9a3dccec.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the
  verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->

<header class="masthead on-deep">
  <div class="masthead-in">
    <h1 class="wordmark">Goals</h1>
    <div class="edition">
      <p class="label">Standing as of</p>
      <p class="today num" id="today"></p>
    </div>
  </div>
  <div class="masthead-rules"><i class="thick"></i><i class="thin"></i></div>
  <div class="standing" id="standing"></div>
</header>

<div class="sheet-wrap">
  <main class="sheet">

    <section class="newentry">
      <h2 class="label">New entry</h2>
      <form id="add-form">
        <div class="types" role="radiogroup" aria-label="Entry type">
          <label><input type="radio" name="type" value="money" checked><span>Monetary</span></label>
          <label><input type="radio" name="type" value="milestone"><span>Milestone</span></label>
        </div>
        <div class="form-grid">
          <div class="field wide">
            <label class="label" for="f-title">Goal</label>
            <input type="text" id="f-title" name="title" placeholder="Road bike" required maxlength="120" autocomplete="off">
          </div>
          <div class="field" id="target-field">
            <label class="label" for="f-target">Target $</label>
            <input type="number" id="f-target" name="target" placeholder="2400" min="0.01" step="0.01" required>
          </div>
          <div class="field">
            <label class="label" for="f-deadline">Due (optional)</label>
            <input type="date" id="f-deadline" name="deadline">
          </div>
          <div class="field submit">
            <span class="label" aria-hidden="true">&nbsp;</span>
            <button type="submit">Enter</button>
          </div>
        </div>
      </form>
    </section>

    <ul class="entries" id="list"></ul>

    <div class="empty" id="empty" hidden>
      <p>No entries recorded. The first one goes above.</p>
    </div>

    <section id="recorded-section" hidden>
      <div class="recorded-head">
        <h2 class="label">Recorded</h2>
        <i></i>
      </div>
      <ul class="entries" id="recorded"></ul>
    </section>

  </main>
</div>

<footer>
  <div class="footer-in">
    <i></i>
    <div class="legend">
      <dl>
        <dt class="label">Legend</dt>
        <dd><span class="swatch"></span> Magenta marks a caution: due within a fortnight, overdue, or behind pace.</dd>
        <dd><span class="rulekey"></span> The heavy rule on each scale is ground covered; ticks are quarters of target.</dd>
      </dl>
      <div class="records">
        <button type="button" id="export">Export record</button>
        <button type="button" id="import">Import record</button>
        <input type="file" id="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </div>
</footer>

<script>
const KEY = 'goals.v1';
const $ = (s) => document.querySelector(s);

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = (g) => localStorage.setItem(KEY, JSON.stringify(g));

let goals = load();

const today = () => new Date().toISOString().slice(0, 10);
const days = (from, to) => Math.round((new Date(to) - new Date(from)) / 86400000);
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// almanac dates: fixed-width day first, so a column of them aligns
function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  return d + ' ' + MONTHS[+m - 1] + ' ' + y;
}
// table figures are uniform: always two decimals, so columns align on the point
const fig = (n) => n.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// flag and tick labels stay compact: decimals only when there are cents
const compact = (n) => n.toLocaleString('en-CA', n % 1
  ? { minimumFractionDigits: 2, maximumFractionDigits: 2 }
  : { maximumFractionDigits: 0 });

// Weekly contribution needed to hit the target by the deadline.
// null when there is nothing left to save or the deadline has passed.
function perWeek(target, current, daysLeft) {
  const remaining = target - current;
  if (remaining <= 0 || daysLeft <= 0) return null;
  return remaining / (daysLeft / 7);
}

// How far short of the pace line you are, as a fraction of target.
// Negative means ahead. null when the goal has no deadline to pace against.
function paceGap(g, now) {
  if (!g.deadline) return null;
  const span = days(g.createdAt, g.deadline);
  if (span <= 0) return null;
  const elapsed = Math.min(Math.max(days(g.createdAt, now || today()), 0), span);
  return (elapsed / span) - (g.current / g.target);
}
// Magenta is scarce on purpose. A couple of points behind on day 21 of 122 is
// noise, not a hazard, so only a material shortfall earns the caution.
const BEHIND = 0.10;
const onPace = (g, now) => { const gap = paceGap(g, now); return gap === null ? null : gap <= 0; };

const isDone = (g) => g.type === 'money' ? g.current >= g.target : g.done;
const find = (id) => goals.find((g) => g.id === id);

// A caution is a chart caution: pressing deadline, passed deadline, or losing ground.
function arrivalOf(g) {
  if (!g.deadline) return null;
  const left = days(today(), g.deadline);
  if (left < 0) return { text: (-left) + (left === -1 ? ' day overdue' : ' days overdue'), sig: true };
  if (left === 0) return { text: 'Due today', sig: true };
  if (left === 1) return { text: '1 day out', sig: true };
  return { text: left + ' days out', sig: left <= 14 };
}

const ICON = {
  amend: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M3 15.2V17h1.8L15.3 6.5 13.5 4.7 3 15.2Z"/><path d="M12.6 3.6 16.4 7.4"/></svg>',
  strike: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M4.5 4.5 15.5 15.5"/><path d="M15.5 4.5 4.5 15.5"/></svg>',
};

function scaleMarkup(g) {
  const pct = Math.max(0, Math.min(g.current / g.target, 1));
  const q = [0, 0.25, 0.5, 0.75, 1];
  const ticks = q.map((t) =>
    '<i class="scale-tick' + (t === 0 || t === 1 ? ' end' : '') + '" style="left:' + (t * 100) + '%"></i>').join('');
  const labels = q.map((t, i) => {
    const cls = i === 0 ? 'zero' : i === 4 ? 'full' : 'mid';
    return '<span class="' + cls + '" style="left:' + (t * 100) + '%">' + compact(Math.round(g.target * t)) + '</span>';
  }).join('');
  return '<div class="scale" style="--pct:' + pct.toFixed(4) + '">' +
    '<div class="scale-track">' + ticks +
      '<div class="scale-run"></div>' +
      '<div class="scale-flag"><b></b></div>' +
    '</div>' +
    '<div class="scale-labels">' + labels + '</div>' +
  '</div>';
}

function entryMarkup(g) {
  const done = isDone(g);
  const title = escapeHtml(g.title);
  const arrival = arrivalOf(g);
  const gap = g.type === 'money' && !done ? paceGap(g) : null;
  const behind = gap !== null && gap > BEHIND;
  const flagged = !done && ((arrival && arrival.sig) || behind);

  const acts =
    '<div class="acts">' +
      '<button class="icon-btn" data-edit="' + g.id + '" aria-label="Rename ' + title + '" title="Rename">' + ICON.amend + '</button>' +
      '<button class="icon-btn" data-del="' + g.id + '" aria-label="Delete ' + title + '" title="Delete">' + ICON.strike + '</button>' +
    '</div>';

  if (done) {
    return '<li class="entry done">' +
      '<div class="entry-head">' +
        '<div class="ident"><h3 class="name">' + title + '</h3></div>' +
        '<span class="filed">' + (g.type === 'money' ? '$' + compact(g.target) + ' reached' : 'Done') + '</span>' +
        acts +
      '</div>' +
    '</li>';
  }

  const head =
    '<div class="entry-head">' +
      '<div class="ident">' +
        '<h3 class="name">' + title + '</h3>' +
        '<p class="label">' + (g.type === 'money' ? 'Monetary' : 'Milestone') + '</p>' +
      '</div>' +
      (arrival
        ? '<div class="arrival">' +
            '<p class="date num">' + fmtDate(g.deadline) + '</p>' +
            '<p class="out' + (arrival.sig ? ' sig' : '') + '">' + arrival.text + '</p>' +
          '</div>'
        : '') +
      acts +
    '</div>';

  let body;
  if (g.type === 'money') {
    const remaining = Math.max(g.target - g.current, 0);
    const rate = g.deadline ? perWeek(g.target, g.current, days(today(), g.deadline)) : null;
    const cols = [
      ['Current', '<span class="unit">$</span>' + fig(g.current), false],
      ['Target', '<span class="unit">$</span>' + fig(g.target), false],
      ['Remaining', '<span class="unit">$</span>' + fig(remaining), false],
    ];
    if (rate !== null) {
      // within tolerance of the pace line reads as on pace; past it, as behind
      const note = gap === null ? '' : behind ? 'behind pace' : 'on pace';
      cols.push(['Per week', '<span class="unit">$</span>' + fig(Math.ceil(rate * 100) / 100) +
        (note ? '<small>' + note + '</small>' : ''), behind]);
    }
    body =
      '<dl class="figs' + (cols.length === 3 ? ' three' : '') + '">' +
        cols.map(function (c) {
          return '<div><dt>' + c[0] + '</dt><dd class="num' + (c[2] ? ' sig' : '') + '">' + c[1] + '</dd></div>';
        }).join('') +
      '</dl>' +
      scaleMarkup(g) +
      '<form class="log" data-add="' + g.id + '">' +
        '<div class="field">' +
          '<label class="label" for="log-' + g.id + '">Log amount</label>' +
          '<input type="number" id="log-' + g.id + '" step="0.01" placeholder="0.00" required>' +
        '</div>' +
        '<button type="submit">Log</button>' +
      '</form>';
  } else {
    body =
      '<div class="status">' +
        '<label class="check">' +
          '<input type="checkbox" data-check="' + g.id + '">' +
          '<span>Not yet</span>' +
        '</label>' +
      '</div>';
  }

  return '<li class="entry' + (flagged ? ' caution' : '') + '">' + head + body + '</li>';
}

function render() {
  goals.sort((a, b) => (isDone(a) - isDone(b)) || (a.createdAt < b.createdAt ? 1 : -1));

  const open = goals.filter((g) => !isDone(g));
  const closed = goals.filter(isDone);

  $('#today').textContent = fmtDate(today());
  $('#list').innerHTML = open.map(entryMarkup).join('');
  $('#recorded').innerHTML = closed.map(entryMarkup).join('');
  $('#recorded-section').hidden = closed.length === 0;
  $('#empty').hidden = goals.length > 0;

  // the standing line is the whole page's answer, in one row
  const bits = [];
  if (goals.length) bits.push(['stat', open.length + ' open', 'of ' + goals.length + ' entries']);
  const cash = open.filter((g) => g.type === 'money');
  if (cash.length) {
    const cur = cash.reduce((s, g) => s + g.current, 0);
    const tot = cash.reduce((s, g) => s + g.target, 0);
    bits.push(['stat', '$' + compact(cur) + ' of $' + compact(tot), 'saved']);
  }
  const dated = open.filter((g) => g.deadline).sort((a, b) => a.deadline < b.deadline ? -1 : 1);
  if (dated.length) {
    const left = days(today(), dated[0].deadline);
    const txt = left < 0 ? (-left) + 'd overdue' : left === 0 ? 'today' : left + 'd';
    bits.push([left <= 14 ? 'stat caution' : 'stat', txt, 'to next arrival']);
  }
  $('#standing').innerHTML = bits.map(function (b) {
    return '<span class="' + b[0] + '"><b>' + b[1] + '</b> ' + b[2] + '</span>';
  }).join('');
}

function commit() { save(goals); render(); }

$('#add-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const type = f.get('type');
  goals.push({
    id: crypto.randomUUID(),
    type: type,
    title: f.get('title').trim(),
    target: type === 'money' ? Number(f.get('target')) : null,
    current: type === 'money' ? 0 : null,
    done: false,
    deadline: f.get('deadline') || null,
    createdAt: today(),
  });
  e.target.reset();
  setTargetVisible(true);
  commit();
});

// milestones have no dollar target, so the field leaves for them
function setTargetVisible(on) {
  $('#target-field').hidden = !on;
  $('#f-target').required = on;
  if (!on) $('#f-target').value = '';
}
$('#add-form').addEventListener('change', (e) => {
  if (e.target.name === 'type') setTargetVisible(e.target.value === 'money');
});

document.addEventListener('click', (e) => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const g = find(del.dataset.del);
    if (confirm('Delete "' + g.title + '"?')) { goals = goals.filter((x) => x.id !== g.id); commit(); }
    return;
  }
  const edit = e.target.closest('[data-edit]');
  if (edit) {
    const g = find(edit.dataset.edit);
    const name = prompt('Rename entry', g.title);
    if (name && name.trim()) { g.title = name.trim(); commit(); }
  }
});

document.addEventListener('change', (e) => {
  const box = e.target.closest('[data-check]');
  if (!box) return;
  find(box.dataset.check).done = box.checked;
  commit();
});

// The one authored moment: the flag travels to its new station and the figures
// climb with it, rather than the row blinking into a new state.
function travel(li, g, from) {
  const scale = li && li.querySelector('.scale');
  const cells = li ? li.querySelectorAll('.figs dd') : [];
  if (!scale || !cells.length) { commit(); return; }

  const to = g.current;
  const pct = Math.max(0, Math.min(to / g.target, 1));
  scale.style.setProperty('--pct', pct.toFixed(4));

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 0 : 620;
  const t0 = performance.now();
  const round = (n) => Math.round(n * 100) / 100;

  // The frames are decoration; the settle is not. A throttled tab can starve
  // rAF, so a timer owns the commit and the loop only paints on the way there.
  let settled = false;
  const settle = () => { if (settled) return; settled = true; commit(); };
  setTimeout(settle, dur + 90);

  (function step(now) {
    if (settled) return;
    const p = dur ? Math.min((now - t0) / dur, 1) : 1;
    const v = from + (to - from) * (1 - Math.pow(1 - p, 3));
    cells[0].innerHTML = '<span class="unit">$</span>' + fig(round(v));
    if (cells[2]) cells[2].innerHTML = '<span class="unit">$</span>' + fig(Math.max(round(g.target - v), 0));
    if (p < 1) requestAnimationFrame(step);
    else settle();
  })(t0);
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-add]');
  if (!form) return;
  e.preventDefault();
  const input = form.querySelector('input');
  const amount = Number(input.value);
  if (!amount) return;
  const g = find(form.dataset.add);
  const from = g.current;
  g.current = Math.max(Math.round((g.current + amount) * 100) / 100, 0);
  save(goals);
  input.value = '';
  travel(form.closest('.entry'), g, from);
});

// backup: localStorage is one cache-clear away from empty
$('#export').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(goals, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'goals-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

$('#import').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw new Error('not a goals backup');
    if (goals.length && !confirm('Replace your ' + goals.length + ' current entries with ' + data.length + ' from this file?')) return;
    goals = data;
    commit();
  } catch (err) {
    alert("Couldn't read that file: " + err.message);
  }
  e.target.value = '';
});

render();

// the only non-obvious math in here: run demo() in devtools
function demo() {
  console.assert(perWeek(1000, 0, 70) === 100, 'need $100/wk over 10 weeks');
  console.assert(perWeek(2400, 350, 140) === 102.5, 'need $102.50/wk');
  console.assert(perWeek(500, 500, 30) === null, 'target already reached');
  console.assert(perWeek(500, 100, 0) === null, 'deadline passed');
  const g = { createdAt: '2026-01-01', deadline: '2026-01-11', target: 100, current: 50 };
  console.assert(onPace(g, '2026-01-06') === true, 'half saved at halfway = on pace');
  console.assert(onPace(g, '2026-01-09') === false, '50% saved at 80% elapsed = behind');
  console.assert(Math.abs(paceGap(g, '2026-01-09') - 0.30) < 1e-9, '30 points short');
  console.assert(paceGap(g, '2026-01-09') > BEHIND, 'a 30-point gap is a caution');
  const near = { createdAt: '2026-08-01', deadline: '2026-12-01', target: 2400, current: 350 };
  console.assert(paceGap(near, '2026-08-22') < BEHIND, 'a 3-point gap is noise, not a caution');
  console.assert(fmtDate('2026-12-01') === '01 Dec 2026', 'almanac date format');
  console.assert(fig(2400) === '2,400.00', 'table figures carry two decimals');
  console.assert(compact(2400) === '2,400', 'tick labels drop empty decimals');
  console.log('demo: ok');
}
window.demo = demo;
</script>
