name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run: the only result that
# matters is the one for the tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Caches the pnpm store, keyed on the lockfile.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Four separate steps rather than `pnpm check`, so the failing one is
      # named in the job summary instead of buried in one step's log.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The unit suite proves the arithmetic; this proves the product. Chromium
      # only: the journeys are about behaviour, not about rendering differences.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End to end
        run: pnpm e2e

      - name: Keep the report when a journey fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Bundle report
        if: always()
        run: |
          echo '### Bundle' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lhS dist/assets 2>/dev/null | head -20 >> "$GITHUB_STEP_SUMMARY" || echo 'no build output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
